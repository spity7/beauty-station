name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      MONGODB_URI_TEST: mongodb://127.0.0.1:27017/ecommerce-platform-ci-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify API contract
        run: npm run api:check

      - name: Build packages
        run: npm run build:packages

      - name: Typecheck
        run: npm run typecheck

      - name: Integration tests
        run: npm run test:ci

      - name: Build admin
        run: npm run build -w @platform/admin

      - name: Build storefront
        run: npm run build -w @platform/storefront
